for(let i=1;i<ROUTE.length;i++){const d=hav(ROUTE[i-1],ROUTE[i]);const j=d>1500;jump.push(j);cum.push(cum[i-1]+(j?0:d));gain.push(gain[i-1]+(j?0:Math.max(0,ROUTE[i][2]-ROUTE[i-1][2])));}
// rescale each day's thinned length to the recorded full-resolution distance (matches the summary report)
const OFFICIAL_KM=[10.6,12.3,12.2,10.4,3.2,10.7,18.6,13.8,8.2];
const rawStart=[],rawEnd=[];for(let i=0;i<ROUTE.length;i++){if(i===0||ROUTE[i][3]!==ROUTE[i-1][3])rawStart.push(cum[i]);if(i===ROUTE.length-1||ROUTE[i+1][3]!==ROUTE[i][3])rawEnd.push(cum[i]);}
const offStart=[0];for(let d=0;d<OFFICIAL_KM.length-1;d++)offStart.push(offStart[d]+OFFICIAL_KM[d]*1000);
function toOfficial(c){let d=rawStart.length-1;while(d>0&&c<rawStart[d])d--;const L=rawEnd[d]-rawStart[d];return offStart[d]+(L>0?(c-rawStart[d])/L:0)*OFFICIAL_KM[d]*1000;}
for(let i=0;i<cum.length;i++)cum[i]=toOfficial(cum[i]);
const TOTAL=cum[cum.length-1];
const BOUNDS=ROUTE.reduce((b,q)=>[Math.min(b[0],q[0]),Math.min(b[1],q[1]),Math.max(b[2],q[0]),Math.max(b[3],q[1])],[999,999,-999,-999]);
let finaleDone=false;
function finale(){finaleDone=true;playing=false;document.getElementById('play').textContent='Play';hideCard();
  map.fitBounds([[BOUNDS[0],BOUNDS[1]],[BOUNDS[2],BOUNDS[3]]],{padding:{top:90,bottom:130,left:40,right:40},pitch:40,bearing:-20,duration:6000,essential:true});
  map.once('moveend',()=>{document.getElementById('cday').textContent="Walker's Haute Route 2026";document.getElementById('cplace').textContent='Verbier → Zermatt';document.getElementById('cstat').textContent='100.0 km · +6,648 m · 9 days · 8 passes';document.getElementById('card').style.display='block';});}
const DAYEND=[],DAYSTART=[];for(let i=0;i<ROUTE.length;i++){if(i===0||ROUTE[i][3]!==ROUTE[i-1][3])DAYSTART.push(cum[i]);if(i===ROUTE.length-1||ROUTE[i+1][3]!==ROUTE[i][3])DAYEND.push(cum[i]);}
const ENDNAME=NAMES.map(n=>n.split(' → ').pop());
const PASSES=[[7898, "Col Termin", 2650, 7.29866, 46.05504], [15532, "Col de Louvie", 2918, 7.32979, 46.07389], [19254, "Col de Prafleuri", 2983, 7.364, 46.08232], [21985, "Col des Roux", 2804, 7.38169, 46.07074], [36729, "Col de Riedmatten", 2922, 7.4328, 46.01824], [54602, "Corne de Sorebois", 2835, 7.58658, 46.14882], [64635, "Forcletta", 2874, 7.65757, 46.18086], [78778, "Augstbordpass", 2890, 7.75338, 46.20885]];
PASSES.forEach(q=>{q[0]=toOfficial(q[0]);});
let holdUntil=0,shown=new Set(),shownP=new Set();
function markShownBefore(d){shown=new Set();DAYEND.forEach((e,k)=>{if(e<d-1)shown.add(k);});shownP=new Set();PASSES.forEach((q,k)=>{if(q[0]<d-1)shownP.add(k);});}
function showPass(k){const q=PASSES[k];document.getElementById('cday').textContent='Pass '+(k+1)+' of 8';document.getElementById('cplace').textContent=q[1];document.getElementById('cstat').textContent=q[2].toLocaleString()+' m';document.getElementById('card').style.display='block';}
function showCard(k){const dk=DAYEND[k]-DAYSTART[k];const i0=cum.findIndex(c=>c>=DAYSTART[k]),i1=cum.findIndex(c=>c>=DAYEND[k]);const g=gain[i1]-gain[i0];
  document.getElementById('cday').textContent='Day '+(k+1)+' of 9 · '+(k===8?'Trek complete':'Arrived');document.getElementById('cplace').textContent=ENDNAME[k];
  document.getElementById('cstat').textContent=(dk/1000).toFixed(1)+' km · +'+Math.round(g)+' m';document.getElementById('card').style.display='block';}
function hideCard(){document.getElementById('card').style.display='none';}
function seekTo(d){finaleDone=false;map.stop();pos=Math.max(0,Math.min(TOTAL,d));resetDone();camLon=null;camBrg=0;markShownBefore(pos);hideCard();holdUntil=0;setCam(pos,true);}
const map=new maplibregl.Map({container:'map',style:{version:8,sources:{
  sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:18,attribution:'Imagery © Esri, Maxar, Earthstar Geographics · Terrain: Mapzen/AWS Terrain Tiles'},
  dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,encoding:'terrarium',maxzoom:14}},
  layers:[{id:'sat',type:'raster',source:'sat'}],sky:{}},
  center:[ROUTE[0][0],ROUTE[0][1]],zoom:13.4,pitch:64,maxPitch:85,attributionControl:{compact:true}});
map.on('load',()=>{
  map.setTerrain({source:'dem',exaggeration:1.15});
  map.setSky({'sky-color':'#88b7e6','horizon-color':'#dfe9f3','fog-color':'#dfe9f3','fog-ground-blend':0.5,'horizon-fog-blend':0.6,'sky-horizon-blend':0.7,'atmosphere-blend':0.6});
  // whole route (faint) + walked (bright) per day
  const feats=[];let seg=[];let day=ROUTE[0][3];
  for(let i=0;i<ROUTE.length;i++){if(i>0&&(jump[i]||ROUTE[i][3]!==day)){feats.push({type:'Feature',properties:{day},geometry:{type:'LineString',coordinates:seg}});seg=[];day=ROUTE[i][3];}seg.push([ROUTE[i][0],ROUTE[i][1]]);}
  feats.push({type:'Feature',properties:{day},geometry:{type:'LineString',coordinates:seg}});
  map.addSource('full',{type:'geojson',data:{type:'FeatureCollection',features:feats}});
  map.addLayer({id:'full',type:'line',source:'full',paint:{'line-color':'#ffffff','line-opacity':0.35,'line-width':3}});
  map.addSource('done',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'done',type:'line',source:'done',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['match',['get','day'],0,COL[0],1,COL[1],2,COL[2],3,COL[3],4,COL[4],5,COL[5],6,COL[6],7,COL[7],COL[8]],'line-width':5}});
  const el=document.createElement('div');el.style.cssText='width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #2ecc71;box-shadow:0 0 12px #fff';
  window.marker=new maplibregl.Marker({element:el}).setLngLat([ROUTE[0][0],ROUTE[0][1]]).addTo(map);
  PASSES.forEach(q=>{const e=document.createElement('div');e.className='pflag';e.innerHTML='<span>'+q[1]+'<br><small>'+q[2].toLocaleString()+' m</small></span>';new maplibregl.Marker({element:e,anchor:'bottom'}).setLngLat([q[3],q[4]]).addTo(map);});
  document.getElementById('load').remove();
  setCam(0,true);
  map.once('idle',()=>{if(!playing){playing=true;document.getElementById('play').textContent='Pause';lastT=null;requestAnimationFrame(frame);showControls();}});
});
window.onerror=function(m){var r=document.getElementById('route');if(r)r.textContent='Error: '+m;};
// --- interpolation along cumulative distance ---
function at(dist){let lo=0,hi=cum.length-1;while(lo<hi){const m=(lo+hi)>>1;if(cum[m]<dist)lo=m+1;else hi=m;}const i=Math.max(1,lo);const a=ROUTE[i-1],b=ROUTE[i];const span=cum[i]-cum[i-1];const f=span>0?(dist-cum[i-1])/span:1;return {lon:a[0]+(b[0]-a[0])*f,lat:a[1]+(b[1]-a[1])*f,ele:a[2]+(b[2]-a[2])*f,i,day:b[3],gain:gain[i-1]+(gain[i]-gain[i-1])*f};}
let pos=0,playing=false,lastT=null,camLon=null,camLat=null,camBrg=0,camPitch=64;
let doneIdx=-1,doneDay=ROUTE[0][3],doneSeg=[],doneFeats=[],frameNo=0;
function resetDone(){doneIdx=-1;doneDay=ROUTE[0][3];doneSeg=[];doneFeats=[];}
function brg(a,b){const y=Math.sin((b.lon-a.lon)*Math.PI/180)*Math.cos(b.lat*Math.PI/180),x=Math.cos(a.lat*Math.PI/180)*Math.sin(b.lat*Math.PI/180)-Math.sin(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.cos((b.lon-a.lon)*Math.PI/180);return Math.atan2(y,x)*180/Math.PI;}
function setCam(dist,snap){
  const p=at(dist),q=at(Math.min(TOTAL,dist+350));
  let b=brg(p,q); if(snap)camBrg=b;
  let db=((b-camBrg+540)%360)-180; camBrg+=db*(snap?1:0.035);
  // look-ahead centre so the hiker sits in the lower third of the view
  const ahead=380, rad=camBrg*Math.PI/180;
  const cLat=p.lat+ahead*Math.cos(rad)/110540, cLon=p.lon+ahead*Math.sin(rad)/(111320*Math.cos(p.lat*Math.PI/180));
  if(camLon===null||snap){camLon=cLon;camLat=cLat;}else{camLon+=(cLon-camLon)*0.08;camLat+=(cLat-camLat)*0.08;}
  const pb=at(Math.max(0,dist-250)),pf=at(Math.min(TOTAL,dist+350));const grad=(pf.ele-pb.ele)/600;  // +climb / -descent
  const tPitch=grad<-0.06?64-22*Math.min(1,(-grad-0.06)/0.22):64;   // 64° normally -> down to 42° on steep descents
  camPitch+=(tPitch-camPitch)*(snap?1:0.03);
  map.jumpTo({center:[camLon,camLat],bearing:camBrg,pitch:camPitch,zoom:13.4});
  if(window.marker){marker.setLngLat([p.lon,p.lat]);marker.getElement().style.borderColor=COL[p.day];}
  if(p.i>doneIdx){for(let i=doneIdx+1;i<=p.i;i++){if(i>0&&(jump[i]||ROUTE[i][3]!==doneDay)){doneFeats.push({type:'Feature',properties:{day:doneDay},geometry:{type:'LineString',coordinates:doneSeg}});doneSeg=[];doneDay=ROUTE[i][3];}doneSeg.push([ROUTE[i][0],ROUTE[i][1]]);}doneIdx=p.i;}
  frameNo++;
  if(frameNo%6===0||snap){const s=map.getSource('done');if(s)s.setData({type:'FeatureCollection',features:doneFeats.concat([{type:'Feature',properties:{day:doneDay},geometry:{type:'LineString',coordinates:doneSeg.concat([[p.lon,p.lat]])}}])});}
  document.getElementById('dbg').textContent='f'+frameNo+' · '+Math.round(dist)+' m';
  document.getElementById('day').textContent='Day '+(p.day+1)+' of 9';document.getElementById('day').style.color=COL[p.day];
  document.getElementById('route').textContent=NAMES[p.day];
  document.getElementById('km').textContent=(dist/1000).toFixed(1)+' km';document.getElementById('alt').textContent=Math.round(p.ele)+' m';document.getElementById('gain').textContent='+'+Math.round(p.gain)+' m';
  document.getElementById('fill').style.width=(100*dist/TOTAL)+'%';
}
function frame(t){if(!playing)return;try{if(lastT===null)lastT=t;const dt=(t-lastT)/1000;lastT=t;
  if(performance.now()<holdUntil){lastT=t;requestAnimationFrame(frame);return;}
  hideCard();
  const spd=+document.getElementById('speed').value;const prev=pos;pos+=dt*60*spd;
  for(let k=0;k<PASSES.length;k++){if(!shownP.has(k)&&prev<PASSES[k][0]&&pos>=PASSES[k][0]){pos=PASSES[k][0];shownP.add(k);showPass(k);holdUntil=performance.now()+2000;setCam(pos,false);lastT=t;requestAnimationFrame(frame);return;}}
  for(let k=0;k<DAYEND.length;k++){if(!shown.has(k)&&prev<DAYEND[k]&&pos>=DAYEND[k]){pos=DAYEND[k];shown.add(k);showCard(k);holdUntil=performance.now()+2500;setCam(pos,false);lastT=t;requestAnimationFrame(frame);return;}}
  if(pos>=TOTAL){pos=TOTAL;if(!finaleDone){finale();return;}playing=false;document.getElementById('play').textContent='Play';}
  setCam(pos,false);}catch(e){document.getElementById('route').textContent='Error: '+e.message;}requestAnimationFrame(frame);}
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play';lastT=null;if(playing)requestAnimationFrame(frame);showControls();};
document.getElementById('rst').onclick=()=>{seekTo(0);playing=false;document.getElementById('play').textContent='Play';};
if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen))document.getElementById('fs').style.display='none';
document.getElementById('fs').onclick=()=>{const d=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}else if(d.requestFullscreen){d.requestFullscreen();}else if(d.webkitRequestFullscreen){d.webkitRequestFullscreen();}};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click();}else if(e.key==='r'||e.key==='R'){document.getElementById('rst').click();}else if(e.key==='f'||e.key==='F'){document.getElementById('fs').click();}else if(e.key==='ArrowRight'){seekTo(pos+500);}else if(e.key==='ArrowLeft'){seekTo(pos-500);}});
let hideTimer=null;
function showControls(){['bar','ver','prog'].forEach(id=>document.getElementById(id).classList.remove('hide'));clearTimeout(hideTimer);if(playing)hideTimer=setTimeout(()=>{['bar','ver','prog'].forEach(id=>document.getElementById(id).classList.add('hide'));},1500);}
['pointerdown','pointermove','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,showControls,{passive:true}));
document.getElementById('pback').onclick=()=>seekTo(pos-500);
document.getElementById('pfwd').onclick=()=>seekTo(pos+500);
document.getElementById('nday').onclick=()=>{const n=DAYSTART.find(d=>d>pos+1);seekTo(n===undefined?TOTAL:n);};
document.getElementById('pday').onclick=()=>{const cur=[...DAYSTART].reverse().find(d=>d<=pos);const back=(pos-cur>400)?cur:([...DAYSTART].reverse().find(d=>d<cur)??0);seekTo(back);};
document.getElementById('prog').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();seekTo(TOTAL*(e.clientX-r.left)/r.width);};
</script></body></html>
